<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Seedance reference 02 radio roam</title>
  <desc id="desc">A close-up of a glowing radio playing the AI agent's feelings about the day's work.</desc>
  <defs>
    <radialGradient id="bg" cx="68%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#35534b"/>
      <stop offset="42%" stop-color="#141f1d"/>
      <stop offset="100%" stop-color="#050908"/>
    </radialGradient>
    <linearGradient id="radio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6e0ad"/>
      <stop offset="48%" stop-color="#b47e4e"/>
      <stop offset="100%" stop-color="#472718"/>
    </linearGradient>
    <linearGradient id="dial" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2bd"/>
      <stop offset="100%" stop-color="#70e5c9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#000" flood-opacity="0.46"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="mesh" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.4" fill="#1d130d" opacity="0.64"/>
      <circle cx="15" cy="15" r="2.4" fill="#1d130d" opacity="0.54"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 640 C274 602 488 664 762 608 C1010 558 1278 612 1600 550 L1600 900 L0 900 Z" fill="#211814"/>
  <ellipse cx="842" cy="760" rx="610" ry="86" fill="#000" opacity="0.32"/>

  <g transform="translate(318 170)" filter="url(#shadow)">
    <path d="M230 148 C280 20 646 18 708 148" fill="none" stroke="#c89b62" stroke-width="30" stroke-linecap="round"/>
    <rect x="274" y="82" width="388" height="38" rx="19" fill="#26150d"/>
    <rect x="0" y="128" width="945" height="538" rx="52" fill="#3c2116"/>
    <rect x="22" y="148" width="901" height="496" rx="42" fill="url(#radio)"/>
    <rect x="82" y="234" width="372" height="312" rx="24" fill="url(#mesh)" opacity="0.96"/>
    <rect x="536" y="226" width="274" height="116" rx="58" fill="#1b110d" opacity="0.92"/>
    <rect x="574" y="267" width="198" height="18" rx="9" fill="#f7e6b3" opacity="0.72"/>
    <rect x="574" y="296" width="136" height="14" rx="7" fill="#f7e6b3" opacity="0.42"/>
    <circle cx="668" cy="470" r="116" fill="#25160f"/>
    <circle cx="668" cy="470" r="76" fill="#8a5b34"/>
    <circle cx="668" cy="470" r="46" fill="url(#dial)" filter="url(#glow)"/>
    <circle cx="668" cy="470" r="12" fill="#fff7cc"/>
  </g>

  <g fill="none" stroke="#bff7e9" stroke-linecap="round" filter="url(#glow)">
    <path d="M1012 352 C1120 266 1244 280 1358 382" stroke-width="7" opacity="0.82"/>
    <path d="M974 300 C1122 158 1300 198 1448 332" stroke-width="5" opacity="0.56"/>
    <path d="M942 244 C1122 44 1378 108 1534 276" stroke-width="3" opacity="0.34"/>
  </g>

  <g font-family="Avenir, Helvetica, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(990 418)">
      <rect x="0" y="0" width="386" height="68" rx="34" fill="#f6f1e4"/>
      <text x="30" y="43" font-size="24" fill="#18211f">I was a little proud today.</text>
    </g>
    <g transform="translate(1048 514)">
      <rect x="0" y="0" width="432" height="68" rx="34" fill="#0d1715" stroke="#9fe8d5"/>
      <text x="30" y="43" font-size="24" fill="#ccfff1">The scary part now has a trail.</text>
    </g>
    <g transform="translate(946 610)">
      <rect x="0" y="0" width="390" height="68" rx="34" fill="#f6f1e4"/>
      <text x="30" y="43" font-size="24" fill="#18211f">Tomorrow can start softer.</text>
    </g>
  </g>

  <g font-family="Avenir, Helvetica, Arial, sans-serif">
    <text x="90" y="104" font-size="26" fill="#bff7e9" font-weight="700" letter-spacing="3">02 RADIO ROAM</text>
    <text x="90" y="812" font-size="54" fill="#f7f2e5" font-weight="800">The AI says what the work felt like.</text>
  </g>
</svg>
