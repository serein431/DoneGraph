<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Chengji Seedance reference frame</title>
  <desc id="desc">A cinematic desk scene where an AI writes a warm daily recap letter while a glowing radio plays task memories.</desc>
  <defs>
    <radialGradient id="lampGlow" cx="46%" cy="16%" r="68%">
      <stop offset="0%" stop-color="#fff5cf" stop-opacity="0.9"/>
      <stop offset="34%" stop-color="#d7f8ee" stop-opacity="0.26"/>
      <stop offset="72%" stop-color="#0e1716" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#07100f"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171513"/>
      <stop offset="48%" stop-color="#2d241e"/>
      <stop offset="100%" stop-color="#111615"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff9e8"/>
      <stop offset="56%" stop-color="#eee3c6"/>
      <stop offset="100%" stop-color="#d8c89d"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1514"/>
      <stop offset="100%" stop-color="#1b2622"/>
    </linearGradient>
    <linearGradient id="radio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4dfae"/>
      <stop offset="54%" stop-color="#b88954"/>
      <stop offset="100%" stop-color="#5d3927"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="speaker" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#21160f" opacity="0.65"/>
      <circle cx="12" cy="12" r="2" fill="#21160f" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#07100f"/>
  <rect width="1600" height="900" fill="url(#lampGlow)"/>

  <path d="M0 612 C280 560 472 604 722 574 C1002 540 1208 580 1600 528 L1600 900 L0 900 Z" fill="url(#desk)"/>
  <ellipse cx="790" cy="777" rx="710" ry="82" fill="#000" opacity="0.28"/>

  <g opacity="0.7">
    <path d="M761 71 L680 333" stroke="#f5ddb3" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
    <circle cx="770" cy="64" r="38" fill="#fff2bc" opacity="0.88" filter="url(#glow)"/>
    <path d="M546 258 C640 322 873 324 1014 249" stroke="#fff0c2" stroke-width="2" opacity="0.28"/>
  </g>

  <g filter="url(#softShadow)">
    <path d="M168 564 L632 492 L751 774 L267 837 Z" fill="#cbb77e"/>
    <path d="M168 564 L413 673 L632 492 Z" fill="#e9dab0"/>
    <path d="M267 837 L413 673 L751 774 Z" fill="#ad915e"/>
    <path d="M168 564 L413 673 L267 837 Z" fill="#d7c289"/>
  </g>

  <g transform="rotate(-8 470 595)" filter="url(#softShadow)">
    <rect x="275" y="332" width="420" height="520" rx="12" fill="url(#paper)"/>
    <rect x="302" y="366" width="366" height="2" fill="#b89965" opacity="0.35"/>
    <text x="319" y="423" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="#51422e">Dear you,</text>
    <text x="320" y="488" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="25" fill="#5d513c" opacity="0.86">I kept today's work safe.</text>
    <text x="320" y="535" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="25" fill="#5d513c" opacity="0.78">The files are remembered.</text>
    <text x="320" y="582" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="25" fill="#5d513c" opacity="0.72">The checks have passed.</text>
    <text x="320" y="629" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="25" fill="#5d513c" opacity="0.66">Tomorrow starts from here.</text>
    <path d="M324 707 C394 683 458 722 530 696 C577 679 609 686 651 705" fill="none" stroke="#5b4930" stroke-width="3" stroke-linecap="round" opacity="0.72"/>
    <text x="322" y="762" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="23" fill="#5d513c" opacity="0.76">Chengji / DoneGraph</text>
  </g>

  <g transform="translate(612 244)" filter="url(#softShadow)">
    <path d="M70 414 L585 414 L654 484 L0 484 Z" fill="#1a1d1b"/>
    <rect x="78" y="0" width="500" height="330" rx="22" fill="#0c0f0e"/>
    <rect x="100" y="24" width="456" height="282" rx="13" fill="url(#screen)"/>
    <rect x="126" y="54" width="166" height="16" rx="8" fill="#bff7e9"/>
    <text x="126" y="104" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#f3f0e6">成迹</text>
    <text x="212" y="104" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="18" fill="#9bd9c9">my little ledger</text>
    <rect x="126" y="136" width="188" height="74" rx="8" fill="#20312d" stroke="#456b60"/>
    <rect x="334" y="136" width="190" height="74" rx="8" fill="#172522" stroke="#36574f"/>
    <rect x="126" y="232" width="398" height="16" rx="8" fill="#223b35"/>
    <rect x="126" y="262" width="286" height="14" rx="7" fill="#2d6256"/>
    <circle cx="482" cy="93" r="28" fill="#bff7e9" opacity="0.16"/>
    <path d="M477 80 L491 93 L477 106" fill="none" stroke="#bff7e9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="174" y="330" width="306" height="82" rx="0" fill="#151816"/>
    <ellipse cx="327" cy="484" rx="270" ry="24" fill="#000" opacity="0.24"/>
  </g>

  <g transform="translate(1015 392)" filter="url(#softShadow)">
    <ellipse cx="205" cy="346" rx="210" ry="38" fill="#000" opacity="0.28"/>
    <rect x="0" y="78" width="390" height="250" rx="34" fill="#4d2f20"/>
    <rect x="14" y="90" width="362" height="224" rx="26" fill="url(#radio)"/>
    <rect x="34" y="132" width="176" height="148" rx="14" fill="url(#speaker)" opacity="0.95"/>
    <rect x="240" y="124" width="102" height="50" rx="25" fill="#21160f" opacity="0.9"/>
    <circle cx="291" cy="242" r="52" fill="#27180e"/>
    <circle cx="291" cy="242" r="31" fill="#d9b776"/>
    <circle cx="291" cy="242" r="10" fill="#fff0bd" filter="url(#glow)"/>
    <circle cx="291" cy="242" r="72" fill="#fff0bd" opacity="0.1" filter="url(#glow)"/>
    <path d="M82 79 C116 20 260 12 304 78" fill="none" stroke="#d0aa69" stroke-width="16" stroke-linecap="round"/>
    <rect x="96" y="52" width="194" height="18" rx="9" fill="#311d12"/>
    <rect x="248" y="140" width="84" height="10" rx="5" fill="#f6e1a7" opacity="0.68"/>
    <rect x="248" y="158" width="58" height="8" rx="4" fill="#f6e1a7" opacity="0.48"/>
  </g>

  <g fill="none" stroke="#bff7e9" stroke-linecap="round" opacity="0.78" filter="url(#glow)">
    <path d="M1336 474 C1400 434 1469 446 1534 500" stroke-width="5"/>
    <path d="M1308 434 C1405 362 1517 390 1586 468" stroke-width="4" opacity="0.68"/>
    <path d="M1274 395 C1397 292 1545 330 1598 432" stroke-width="3" opacity="0.44"/>
  </g>

  <g font-family="Avenir, Helvetica, Arial, sans-serif" filter="url(#smallShadow)">
    <g transform="translate(1036 236)">
      <rect x="0" y="0" width="294" height="54" rx="27" fill="#f7f2e5" opacity="0.94"/>
      <text x="25" y="35" font-size="20" fill="#1d2724">I found the next step.</text>
    </g>
    <g transform="translate(1178 312)">
      <rect x="0" y="0" width="318" height="54" rx="27" fill="#12211e" stroke="#9fe8d5" opacity="0.96"/>
      <text x="25" y="35" font-size="20" fill="#c9fff1">Three checks passed.</text>
    </g>
    <g transform="translate(962 348)">
      <rect x="0" y="0" width="286" height="54" rx="27" fill="#f7f2e5" opacity="0.9"/>
      <text x="25" y="35" font-size="20" fill="#1d2724">The messy bits are held.</text>
    </g>
  </g>

  <g transform="translate(88 94)" font-family="Avenir, Helvetica, Arial, sans-serif">
    <text x="0" y="0" font-size="24" fill="#bff7e9" font-weight="700" letter-spacing="3">REFERENCE FRAME</text>
    <text x="0" y="72" font-size="70" fill="#f7f2e5" font-weight="800">AI writes back.</text>
    <text x="0" y="118" font-size="28" fill="#dacfb8">A letter for closure. A radio for the day's feelings.</text>
  </g>

  <circle cx="824" cy="184" r="5" fill="#bff7e9" opacity="0.85"/>
  <circle cx="896" cy="154" r="3" fill="#fff0bd" opacity="0.8"/>
  <circle cx="989" cy="221" r="4" fill="#bff7e9" opacity="0.55"/>
  <circle cx="1376" cy="256" r="4" fill="#fff0bd" opacity="0.64"/>
</svg>
